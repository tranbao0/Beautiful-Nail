<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Beautiful Nail</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    body { background: var(--cream); }
    .auth-wrap {
      max-width: 420px;
      margin: 80px auto;
      padding: 0 24px 80px;
    }
    .auth-card {
      background: var(--white);
      border: 1px solid var(--border);
      padding: 40px 36px;
    }
    .auth-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .auth-subtitle {
      font-size: 12px;
      color: var(--gray);
      margin-bottom: 28px;
    }
    .auth-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 12px;
      padding: 10px 14px;
      margin-bottom: 20px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--gray);
    }
    .auth-footer a { color: var(--black); font-weight: 500; }
    .pw-wrap { position: relative; }
    .pw-wrap input { width: 100%; padding-right: 44px; box-sizing: border-box; }
    .pw-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 12px; color: var(--gray); padding: 0;
    }
  </style>
</head>
<body>

<nav th:replace="~{fragments/nav :: nav}"></nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">Welcome back</div>
    <div class="auth-subtitle">Sign in to manage your appointments</div>

    <div th:if="${error}" class="auth-error" th:text="${error}"></div>

    <form method="post" action="/login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required autocomplete="email"
               th:value="${email}" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="loginPw" name="password" required autocomplete="current-password"
                 placeholder="••••••••">
          <button type="button" class="pw-toggle" onclick="togglePw('loginPw', this)">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn-filled" style="width:100%;text-align:center;margin-top:8px;">
        Sign In
      </button>
    </form>
  </div>

  <div class="auth-footer">
    Don't have an account? <a href="/register">Create one</a>
  </div>
</div>

<footer>&copy; 2026 Beautiful Nail &nbsp;·&nbsp; All rights reserved</footer>
<script>
  function togglePw(id, btn) {
    const input = document.getElementById(id);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? 'Hide' : 'Show';
  }
</script>
</body>
</html>
