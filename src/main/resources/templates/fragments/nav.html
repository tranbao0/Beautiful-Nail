<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav">
  <a href="/" class="nav-brand">Beautiful Nail</a>
  <div class="nav-links">
    <a href="/services">Services</a>
    <a href="/slots">Availability</a>

    <!-- Receptionist gets a Dashboard link instead of My Appointments -->
    <th:block th:if="${session.userRole == 'receptionist'}">
      <a href="/receptionist">Dashboard</a>
    </th:block>
    <th:block th:if="${session.userRole == 'customer'}">
      <a href="/appointments" class="btn btn-sm">My Appointments</a>
    </th:block>

    <!-- Logged-in user: name + logout -->
    <th:block th:if="${session.userId != null}">
      <span style="font-size:12px;color:var(--gray);padding:0 4px;"
            th:text="${session.userName}">User Name</span>
      <form method="post" action="/logout" style="display:inline;margin:0;">
        <button type="submit" class="btn btn-sm">Logout</button>
      </form>
    </th:block>

    <!-- Guest: login link -->
    <th:block th:if="${session.userId == null}">
      <a href="/login" class="btn btn-sm">Login</a>
    </th:block>
  </div>
</nav>
</body>
</html>
