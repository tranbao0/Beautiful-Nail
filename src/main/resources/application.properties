# Application
spring.application.name=beautiful-nail-scheduler
server.port=8080

# SQLite DataSource
spring.datasource.url=jdbc:sqlite:./db/beautiful_nail.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Disable JPA auto-config (we use JDBC only)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# External Notification Service
notification.service.url=http://localhost:8080/api/external/notifications

# Logging (M6 - System Management)
logging.level.com.beautifulnail=INFO
logging.level.org.springframework.jdbc=DEBUG
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Enable scheduling for notification retry queue (M6)
spring.task.scheduling.pool.size=2
